<!-- Publish capabilities (exact JSON): {"mcp":{"servers":[{"server":"Google Sheets","tools":["get_values","update_values"]}]},"db":{},"user":{}}
     Needs the Google Sheets connector signed into the Google account that owns the tracker Sheet. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4EDE0; --paper-2:#E7DCC7; --card:#FCF8F1;
  --ink:#1A1526; --ink-2:#4A3F5E; --ink-3:#6B6079;
  --on-ink:#F4EDE0;
  --violet:#7C5BD9; --violet-deep:#4C2E9E; --lavender:#B9A6E8;
  --coral:#EE8A5E; --pink:#E8689A; --teal:#3FC7B8; --amber:#F0A35E;
  --link:#4C2E9E; --focus:#4C2E9E;
  --banner-bg:#FFF1C7; --banner-ink:#4A3A00;
  --fixed-dark:#1A1526;
  --shadow:5px 5px 0 var(--ink); --shadow-lg:8px 8px 0 var(--ink);
  --radius:4px;
  --font-display:"Fraunces",Georgia,serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-grot:"Space Grotesk","Inter",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16121E; --paper-2:#2A2338; --card:#211B2D;
    --ink:#EFE6D4; --ink-2:#CFC5DD; --ink-3:#A89DBA;
    --on-ink:#16121E;
    --link:#C9B8F5; --focus:#F0A35E;
    --banner-bg:#3A3110; --banner-ink:#F6E7A8;
    --shadow:5px 5px 0 #000; --shadow-lg:8px 8px 0 #000;
  }
}
:root[data-theme="dark"]{
  --paper:#16121E; --paper-2:#2A2338; --card:#211B2D;
  --ink:#EFE6D4; --ink-2:#CFC5DD; --ink-3:#A89DBA;
  --on-ink:#16121E;
  --link:#C9B8F5; --focus:#F0A35E;
  --banner-bg:#3A3110; --banner-ink:#F6E7A8;
  --shadow:5px 5px 0 #000; --shadow-lg:8px 8px 0 #000;
}
*{box-sizing:border-box;margin:0;padding:0}
.strip,.pipeline{scrollbar-width:thin;scrollbar-color:var(--ink-3) var(--paper-2)}
.strip::-webkit-scrollbar{height:10px}
.strip::-webkit-scrollbar-track{background:var(--paper-2);border-radius:5px}
.strip::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:5px;border:2px solid var(--paper-2)}
body{font-family:var(--font-body);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.55;min-height:100vh;overflow-x:hidden}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 120px}
@media(min-width:760px){.wrap{padding:0 40px 120px}}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
a{color:var(--link)}


header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;padding:30px 0 6px}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(44px,8vw,66px);letter-spacing:-.03em;line-height:.95}
h1 em{font-style:normal;color:var(--pink)}
.hright{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:15px;color:var(--ink-3)}
.hright .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.chip,.small{font-family:var(--font-grot);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;
  border:2px solid var(--ink);border-radius:3px;padding:9px 14px;background:var(--card);color:var(--ink);cursor:pointer;
  box-shadow:2px 2px 0 var(--ink);transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.chip:hover,.small:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.chip:active,.small:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.chip .cnt{margin-left:6px;opacity:.75}
.small{padding:5px 12px;font-size:13px}

.tabs{display:flex;gap:10px;padding:18px 0 4px}
.tabs .chip{font-size:16px;padding:11px 24px}
.tabs .chip[aria-selected="true"]{background:var(--violet);color:#fff}
.tabs .chip .cnt{margin-left:8px;background:var(--paper-2);color:var(--ink);border-radius:3px;padding:0 8px}
.tabs .chip[aria-selected="true"] .cnt{background:#fff;color:var(--fixed-dark)}
.filters{display:flex;flex-wrap:wrap;gap:9px;padding:12px 0 6px}

/* section headers */
section.grp{margin-top:34px}
.slabel{display:flex;align-items:center;gap:14px;width:100%;color:var(--ink);padding:6px 0}
.slabel .t{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,4vw,32px);letter-spacing:-.02em;line-height:1.1}
.slabel .count{font-family:var(--font-grot);font-weight:700;font-size:15px;color:var(--ink-3)}
.slabel::after{content:"";flex:1;height:3px;background:var(--ink);border-radius:2px;order:3}

/* top picks */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(215px,1fr);gap:14px;overflow-x:auto;padding:16px 6px 14px;margin:0 -6px}
.pick{border:3px solid var(--ink);border-radius:var(--radius);padding:16px 18px;text-align:left;cursor:pointer;color:var(--fixed-dark);
  box-shadow:var(--shadow);font:inherit;display:flex;flex-direction:column;gap:6px;transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.pick:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.pick .co{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.1}
.pick .ti{font-size:14px;font-weight:500;line-height:1.35;color:inherit;font-family:var(--font-body)}
.pick .fit{font-family:var(--font-grot);font-weight:700;font-size:15px;margin-top:auto;padding-top:8px}
.pick.c0{background:var(--pink)} .pick.c1{background:var(--violet);color:#fff} .pick.c2{background:var(--coral)}
.pick.c3{background:var(--teal)} .pick.c4{background:var(--amber)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px;padding:18px 6px 8px;margin:0 -6px}
@media(max-width:420px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:3px solid var(--ink);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--shadow);transition:transform .16s var(--ease),opacity .3s var(--ease)}
.card.leaving{opacity:0;transform:scale(.94)}
.card.flash{animation:flash 1.2s var(--ease)}
@keyframes flash{0%,60%{box-shadow:0 0 0 6px var(--amber),var(--shadow)}100%{box-shadow:var(--shadow)}}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fitb{font-family:var(--font-grot);font-weight:700;font-size:14px;border:2px solid var(--ink);border-radius:3px;padding:1px 9px;color:var(--fixed-dark)}
.fit-hi{background:var(--teal)} .fit-mid{background:var(--amber)} .fit-lo{background:var(--paper-2);color:var(--ink)}
.srcchip{font-family:var(--font-grot);font-weight:600;font-size:13px;color:var(--ink-2);border:2px solid var(--ink-3);border-radius:3px;padding:0 8px;margin-left:auto}
.co{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.1}
.ti{font-family:var(--font-grot);font-size:15px;font-weight:600;color:var(--ink-2);line-height:1.3}
.meta{font-size:13.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px}
.why{font-family:var(--font-display);font-style:italic;font-size:14.5px;line-height:1.45;border-left:3px solid var(--pink);padding-left:12px}
.open{font-weight:500;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:12px;border-top:2px solid var(--ink)}
.btn{font-family:var(--font-grot);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;border-radius:3px;
  padding:12px 14px;min-height:46px;cursor:pointer;text-align:center;border:2px solid var(--ink);background:var(--card);color:var(--ink);flex:1 1 auto;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s var(--ease),background .12s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn:hover{background:var(--paper-2)}
.btn.fill{background:var(--ink);color:var(--on-ink)}
.btn.fill:hover{background:var(--pink);color:var(--fixed-dark)}
.btn.wide{flex-basis:100%}
.passbox{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:12px;border-top:2px solid var(--ink)}
.passbox label{font-weight:600;font-size:15px}
.passbox input{font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--ink);border-radius:3px;background:var(--paper);color:var(--ink);width:100%}
.passbox .row{display:flex;gap:8px}
.passbox .row .btn{flex:1}
.copybox{display:flex;flex-direction:column;gap:6px;padding-top:8px;font-size:15px}
.copybox input{font:inherit;font-size:15px;padding:8px 10px;border:2px solid var(--ink);border-radius:3px;background:var(--paper);color:var(--ink);width:100%}

/* pipeline */
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:22px;align-items:start}
@media(max-width:1239px){.pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:699px){.pipeline{grid-template-columns:minmax(0,1fr)}}
.pcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.pcolhead{font-family:var(--font-grot);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:8px;padding-bottom:9px;border-bottom:3px solid var(--ink)}
.pcolhead .n{margin-left:auto;background:var(--ink);color:var(--on-ink);border-radius:3px;padding:0 9px}
.pcard{background:var(--card);border:3px solid var(--ink);border-radius:var(--radius);padding:14px 16px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:7px}
.pcard .actions{padding-top:10px}
.pempty{font-family:var(--font-display);font-style:italic;color:var(--ink-3);font-size:15px;padding:6px 2px}
.helper{font-size:14px;color:var(--ink-3);padding:6px 0 0}
.hidenote{margin-top:34px;font-size:15px;color:var(--ink-3)}
.empty{font-family:var(--font-display);font-style:italic;color:var(--ink-2);padding:22px 4px;font-size:18px}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);z-index:200;background:var(--ink);color:var(--on-ink);
  border-left:6px solid var(--pink);border-radius:4px;padding:13px 22px;font-family:var(--font-grot);font-weight:600;font-size:16px;
  opacity:0;pointer-events:none;transition:all .3s var(--ease);max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.setup{max-width:560px;margin:34px auto 0;background:var(--card);border:3px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:12px}
.setup h2{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.15}
.setup p{font-size:15px;color:var(--ink-2)}
.setup label{font-weight:600;font-size:15px;display:block;margin-bottom:6px}
.setup input{font:inherit;font-size:16px;padding:11px 12px;border:2px solid var(--ink);border-radius:3px;background:var(--paper);color:var(--ink);width:100%}
.setup .row{display:flex;gap:8px;margin-top:12px}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--banner-bg);color:var(--banner-ink);border:2px solid var(--ink);border-radius:var(--radius);padding:12px 16px;margin-top:18px;font-size:15px;font-weight:500}
.notice .btn{flex:0 0 auto}
.btn:disabled{opacity:.6;cursor:default}
.card.busy,.pcard.busy{opacity:.7}
.linkbtn{background:none;border:0;font:inherit;font-size:14px;color:var(--link);text-decoration:underline;cursor:pointer;padding:5px 4px}
.pcard.leaving{opacity:0;transform:scale(.94);transition:all .3s}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Job Inbox<em>.</em></h1>
    <div class="hright">
      <span id="lastread"></span>
      <div class="row">
        <button class="small" id="refresh" type="button" hidden>Refresh</button>
        <button class="small" id="theme" type="button" aria-label="Switch between light and dark mode">Dark mode</button>
        <button class="linkbtn" id="changesheet" type="button" hidden>Change Sheet</button>
      </div>
    </div>
  </header>
  <div class="tabs" role="tablist" aria-label="Views">
    <button class="chip" role="tab" id="tab-inbox" data-tab="inbox" aria-selected="true" type="button">Inbox <span class="cnt" id="cnt-inbox" hidden></span></button>
    <button class="chip" role="tab" id="tab-pipeline" data-tab="pipeline" aria-selected="false" type="button">Pipeline <span class="cnt" id="cnt-pipeline" hidden></span></button>
  </div>
  <div id="msgView"></div>
  <div id="setupView" hidden></div>
  <div id="mainView" hidden>
    <div id="inboxView">
      <div class="filters" id="filters" role="group" aria-label="Filter by type"></div>
      <p class="helper" id="helper" hidden>Build in Claude copies a command. Paste it into Claude and it builds your r&eacute;sum&eacute; and cover letter.</p>
      <div id="inboxBody"></div>
    </div>
    <div id="pipelineView" hidden></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const PREFILL_SHEET_URL = "";

const SERVER = "Google Sheets";
const TAB_NAME = "Jobs";
const STATUSES = ["New","Saved","Ready to apply","Applied","Interviewing","Offer","Passed","Closed"];
const PIPE = ["Saved","Ready to apply","Applied","Interviewing","Offer"];
const TYPE_ORDER = ["Staff","Fellowship","Freelance","Contract/Freelance","Nearby field"];
const LS_KEY = "jobInboxSheetUrl";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let mcp = null, sheetId = null, sheetUrl = "";
let COL = {};            // header name -> column index
let JOBS = [];           // parsed rows
let loaded = false, loading = false;
let lastRead = null;
let tab = "inbox", typeFilter = "ALL";
let notice = null;       // {text, retry}
let mode = "boot";       // boot | nomcp | setup | ready
const busy = new Set();  // sheet row numbers being written

/* ---------- small helpers ---------- */
let tt;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 4200);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const colLetter = i => String.fromCharCode(65 + i);
const fitCls = f => f >= 8 ? "fit-hi" : f >= 7 ? "fit-mid" : "fit-lo";
function ago(v){
  if (!v) return "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)){
    const a = new Date(v + "T00:00:00"), t = new Date(); t.setHours(0,0,0,0);
    const n = Math.round((t - a) / 86400000);
    return n <= 0 ? "Posted today" : n === 1 ? "Posted yesterday" : "Posted " + n + " days ago";
  }
  return "Posted " + v;
}
function parsePayload(r){
  let p = r && r.payload;
  if (typeof p === "string"){ try { p = JSON.parse(p); } catch(e){ p = null; } }
  return p || {};
}

/* ---------- theme ---------- */
function currentTheme(){
  const r = document.documentElement.getAttribute("data-theme");
  if (r === "dark" || r === "light") return r;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function syncThemeBtn(){ $("#theme").textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode"; }
$("#theme").addEventListener("click", () => {
  document.documentElement.setAttribute("data-theme", currentTheme() === "dark" ? "light" : "dark");
  syncThemeBtn();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeBtn);

/* ---------- error messages ---------- */
function explain(e){
  const code = e && e.code, msg = (e && e.message) || "";
  let blob = msg; try { blob += " " + JSON.stringify((e && e.result) || ""); } catch(x){}
  if (code === "needs_reauth") return {text:"Reconnect Google Sheets in claude.ai Customize, Connectors."};
  if (code === "server_not_connected") return {text:"Add the Google Sheets connector in claude.ai Customize, Connectors."};
  if (code === "selection_required") return {text:"You have two Google Sheets connectors. Pick one in claude.ai Customize, Connectors."};
  if (code === "approval_required" || code === "not_in_manifest" || code === "consent_required") return {text:"This page needs your OK to use Google Sheets.", retry:true, label:"Allow and try again"};
  if (code === "tool_error"){
    if (/permission|forbidden|denied|not have access|insufficient|403|caller does not/i.test(blob))
      return {text:"Your Google Sheets connector can't open this Sheet. Check it's signed into the same Google account that owns the Sheet."};
    if (/unable to parse range|not found|no sheet|404/i.test(blob))
      return {text:"I could not find that Sheet or its Jobs tab. Check the link."};
    return {text:"Google Sheets said: " + (msg || "it could not do that.")};
  }
  if (code === "server_unavailable" || code === "upstream_error" || code === "rate_limited")
    return {text:"Google Sheets did not answer. Try again in a moment.", retry:true, label:"Try again"};
  return {text:"Something went wrong talking to Google Sheets. Try again in a moment.", retry:true, label:"Try again"};
}

/* ---------- Sheets calls ---------- */
async function sheets(tool, input, opts, isRead){
  try {
    return await mcp.callTool(SERVER, tool, input, opts);
  } catch (e){
    if (isRead && e && e.retryable){        // reads only: one automatic retry
      await sleep(Math.max(e.retryAfterMs || 0, 600 + Math.random() * 1400));
      return await mcp.callTool(SERVER, tool, input, opts);
    }
    throw e;
  }
}
const readRange = (range, fresh) => sheets("get_values", {spreadsheetId: sheetId, range}, fresh ? {cache:false} : undefined, true);
const writeCell = (range, value) => sheets("update_values", {spreadsheetId: sheetId, range, values: [[value]]}, undefined, false);

/* ---------- saved Sheet link ---------- */
function extractId(text){
  const t = String(text || "").trim();
  const m = t.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  return /^[a-zA-Z0-9_-]{20,}$/.test(t) ? t : null;
}
async function dbDoc(){
  try {
    const user = await window.claude.use("user"); if (!user) return null;
    const id = await user.id(); if (!id) return null;
    const db = await window.claude.use("db"); if (!db) return null;
    return db.doc("data/users/" + id + "/settings");
  } catch(e){ return null; }
}
async function getStoredUrl(){
  const doc = await dbDoc();
  if (doc){
    try { const s = await doc.get(); const u = s.exists && s.data() && s.data().sheetUrl; if (u) return u; } catch(e){}
  }
  try { const u = localStorage.getItem(LS_KEY); if (u) return u; } catch(e){}
  return "";
}
async function storeUrl(url){
  const doc = await dbDoc();
  if (doc){ try { await doc.set({sheetUrl: url}); } catch(e){} }
  try { localStorage.setItem(LS_KEY, url); } catch(e){}
}

/* ---------- reading ---------- */
function parseJobs(values){
  const head = (values[0] || []).map(h => String(h).trim());
  COL = {}; head.forEach((h, i) => { if (h && !(h in COL)) COL[h] = i; });
  const get = (row, name) => (name in COL && row[COL[name]] != null) ? String(row[COL[name]]).trim() : "";
  const out = [];
  for (let i = 1; i < values.length; i++){
    const row = values[i] || [];
    if (!row.some(c => String(c == null ? "" : c).trim() !== "")) continue;
    const st = get(row, "Status");
    const canon = STATUSES.find(s => s.toLowerCase() === st.toLowerCase()) || st;
    const fit = parseInt(get(row, "Fit"), 10);
    out.push({row: i + 1, Status: canon, Fit: isNaN(fit) ? null : fit, Type: get(row, "Type") || "Other",
      Title: get(row, "Job title"), Org: get(row, "Org"), Location: get(row, "Location"), Why: get(row, "Why it fits"),
      Source: get(row, "Source"), Posted: get(row, "Posted"), Link: get(row, "Link"), Folder: get(row, "Folder"), Notes: get(row, "Notes")});
  }
  return out;
}
function headersOk(values){
  const h = ((values && values[0]) || []).map(x => String(x).trim());
  return ["Status","Org","Job title"].every(n => h.includes(n));
}
async function load(fresh){
  if (loading) return; loading = true;
  notice = null; renderAll();
  try {
    const r = await readRange(TAB_NAME + "!A1:Z", fresh);
    const values = parsePayload(r).values || [];
    if (!headersOk(values) && (values[0] || []).length >= 26 && String(values[0][25]).trim() !== ""){
      notice = {text:"This Sheet has too many columns for the inbox. Keep the job columns in A to Z."};
    } else if (!headersOk(values)){
      notice = {text:"This does not look like your job tracker. I need a Jobs tab with Status, Org and Job title columns."};
    } else {
      JOBS = parseJobs(values); loaded = true;
      lastRead = new Date((r.cache && r.cache.storedAt) || Date.now());
    }
  } catch(e){ notice = explain(e); }
  loading = false; renderAll();
}

/* ---------- rendering ---------- */
const byStatus = s => JOBS.filter(j => j.Status === s);
function renderHeader(){
  $("#lastread").textContent = (mode === "ready" && lastRead)
    ? "Last read from your Sheet: " + lastRead.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : "";
  $("#refresh").hidden = mode !== "ready";
  $("#changesheet").hidden = !(mode === "ready" || mode === "setup") ;
  $("#cnt-inbox").textContent = loaded ? byStatus("New").length : "";
  $("#cnt-pipeline").textContent = loaded ? PIPE.reduce((n, s) => n + byStatus(s).length, 0) : "";
  document.querySelectorAll(".tabs .cnt").forEach(c => c.hidden = !loaded);
}
function noticeHtml(){
  if (!notice) return "";
  return `<div class="notice" role="alert"><span>${esc(notice.text)}</span>${notice.retry ? `<button class="btn fill" type="button" data-act="retryload">${esc(notice.label || "Try again")}</button>` : ""}</div>`;
}
function setupHtml(){
  return `<div class="setup"><h2>Paste the link to your job tracker Sheet</h2>
    <p>It is the Google Sheet called Job tracker. Open it, copy the link from the top of your browser, and paste it here. You only do this once.</p>
    <form id="setupForm"><label for="sheetLink">Sheet link</label>
      <input id="sheetLink" type="text" inputmode="url" autocomplete="off" placeholder="https://docs.google.com/spreadsheets/d/...">
      <div class="row"><button class="btn fill" type="submit" id="setupSave">Save</button>${loaded ? '<button class="btn" type="button" data-act="setupcancel">Cancel</button>' : ""}</div>
    </form>${noticeHtml()}</div>`;
}
function card(j){
  const isBusy = busy.has(j.row);
  return `<article class="card${isBusy ? " busy" : ""}" id="job-${j.row}" data-row="${j.row}">
    <div class="top">${j.Fit != null ? `<span class="fitb ${fitCls(j.Fit)}">Fit ${j.Fit}</span>` : ""}${j.Source ? `<span class="srcchip">${esc(j.Source)}</span>` : ""}</div>
    <div class="co">${esc(j.Org)}</div>
    <div class="ti">${esc(j.Title)}</div>
    <div class="meta"><span>${esc([j.Location, ago(j.Posted)].filter(Boolean).join(" · "))}</span>${j.Link ? `<a class="open" href="${esc(j.Link)}" target="_blank" rel="noopener">Open posting</a>` : ""}</div>
    ${j.Why ? `<div class="why">&ldquo;${esc(j.Why)}&rdquo;</div>` : ""}
    <div class="actions" data-actions>
      <button class="btn fill" type="button" data-act="save"${isBusy ? " disabled" : ""}>${isBusy ? "Saving..." : "Save"}</button>
      <button class="btn" type="button" data-act="pass"${isBusy ? " disabled" : ""}>Pass</button>
      <button class="btn wide" type="button" data-act="build">Build in Claude</button>
    </div>
  </article>`;
}
function renderInbox(){
  const news = byStatus("New");
  const types = [...TYPE_ORDER.filter(t => news.some(j => j.Type === t)), ...[...new Set(news.map(j => j.Type))].filter(t => !TYPE_ORDER.includes(t))];
  const mk = (label, key, n) => `<button class="chip" type="button" data-type="${esc(key)}" aria-pressed="${typeFilter === key}">${esc(label)}<span class="cnt">${n}</span></button>`;
  $("#filters").innerHTML = (loaded && news.length) ? mk("All","ALL",news.length) + types.map(t => mk(t, t, news.filter(j => j.Type === t).length)).join("") : "";
  $("#helper").hidden = !loaded;
  let html = noticeHtml();
  if (!loaded){
    if (!notice) html = '<p class="empty">Reading your Sheet...</p>';
    $("#inboxBody").innerHTML = html; return;
  }
  if (!JOBS.length){ $("#inboxBody").innerHTML = html + '<p class="empty">No jobs yet. Your morning scan adds them.</p>'; return; }
  if (!news.length){ $("#inboxBody").innerHTML = html + '<p class="empty">Nothing new right now. Nice work.</p>'; return; }
  if (typeFilter !== "ALL" && !types.includes(typeFilter)) typeFilter = "ALL";
  const picks = news.filter(j => j.Fit != null && j.Fit >= 8).sort((a,b) => b.Fit - a.Fit).slice(0,5);
  if (picks.length){
    html += `<section class="grp"><h2 class="slabel"><span class="t">Top Picks</span><span class="count">${picks.length}</span></h2>
      <div class="strip">${picks.map((j,i) => `<button class="pick c${i}" type="button" data-pick="${j.row}"><span class="co">${esc(j.Org)}</span><span class="ti">${esc(j.Title)}</span><span class="fit">Fit ${j.Fit}</span></button>`).join("")}</div></section>`;
  }
  (typeFilter === "ALL" ? types : [typeFilter]).forEach(t => {
    const rows = news.filter(j => j.Type === t);
    if (!rows.length) return;
    html += `<section class="grp"><h2 class="slabel"><span class="t">${esc(t)}</span><span class="count">${rows.length}</span></h2>
      <div class="body"><div class="grid">${rows.map(card).join("")}</div></div></section>`;
  });
  $("#inboxBody").innerHTML = html;
}
function pcard(j){
  const b = busy.has(j.row), d = b ? " disabled" : "";
  let acts = "";
  if (j.Status === "Saved") acts = `<button class="btn fill" type="button" data-act="build">Build in Claude</button><button class="btn" type="button" data-act="pass"${d}>Pass</button>`;
  if (j.Status === "Ready to apply") acts = `${j.Folder ? `<a class="btn" href="${esc(j.Folder)}" target="_blank" rel="noopener">Open docs folder</a>` : ""}<button class="btn fill" type="button" data-act="applied"${d}>I applied</button>`;
  if (j.Status === "Applied") acts = `<button class="btn fill" type="button" data-act="toInterview"${d}>Move to Interviewing</button>`;
  if (j.Status === "Interviewing") acts = `<button class="btn fill" type="button" data-act="toOffer"${d}>Move to Offer</button>`;
  const why = (j.Why && (j.Status === "Saved" || j.Status === "Ready to apply")) ? `<div class="why">&ldquo;${esc(j.Why)}&rdquo;</div>` : "";
  return `<article class="pcard${b ? " busy" : ""}" data-row="${j.row}">
    <div class="top">${j.Fit != null ? `<span class="fitb ${fitCls(j.Fit)}">Fit ${j.Fit}</span>` : ""}</div>
    <div class="co">${esc(j.Org)}</div><div class="ti">${esc(j.Title)}</div>
    <div class="meta"><span>${esc([j.Location, ago(j.Posted)].filter(Boolean).join(" · "))}</span>${j.Link ? `<a class="open" href="${esc(j.Link)}" target="_blank" rel="noopener">Open posting</a>` : ""}</div>
    ${why}
    ${acts ? `<div class="actions" data-actions>${acts}</div>` : ""}</article>`;
}
function renderPipeline(){
  if (!loaded){ $("#pipelineView").innerHTML = noticeHtml() || '<p class="empty">Reading your Sheet...</p>'; return; }
  $("#pipelineView").innerHTML = noticeHtml() + `<div class="pipeline">` + PIPE.map(s => {
    const rows = byStatus(s);
    return `<div class="pcol"><div class="pcolhead"><span>${esc(s)}</span><span class="n">${rows.length}</span></div>
      ${rows.length ? rows.map(pcard).join("") : '<p class="pempty">Nothing here yet.</p>'}</div>`;
  }).join("") + `</div><p class="hidenote">Passed and Closed are hidden. They stay in your Sheet.</p>`;
}
function renderAll(){
  renderHeader();
  const main = $("#mainView"), setup = $("#setupView"), msg = $("#msgView");
  main.hidden = mode !== "ready"; setup.hidden = mode !== "setup"; msg.hidden = !(mode === "boot" || mode === "nomcp");
  if (mode === "boot") msg.innerHTML = '<p class="empty">Connecting to Google Sheets...</p>';
  if (mode === "nomcp") msg.innerHTML = '<div class="notice" role="alert"><span>Open this page on claude.ai to see your jobs.</span></div>';
  if (mode === "setup"){ const v = $("#sheetLink") ? $("#sheetLink").value : ""; setup.innerHTML = setupHtml(); if (v) $("#sheetLink").value = v; }
  if (mode === "ready"){
    $("#inboxView").hidden = tab !== "inbox"; $("#pipelineView").hidden = tab !== "pipeline";
    if (tab === "inbox") renderInbox(); else renderPipeline();
  }
}

/* ---------- writing ---------- */
async function writeStatus(job, status, reason){
  const r = job.row;
  // 1. re-read the header row and use FRESH column positions for this write
  const hv = parsePayload(await readRange(TAB_NAME + "!A1:Z1", true)).values || [];
  const head = ((hv[0]) || []).map(h => String(h).trim());
  const F = {}; head.forEach((h, i) => { if (h && !(h in F)) F[h] = i; });
  if (!("Status" in F) || !("Org" in F) || !("Job title" in F)) throw {code:"changed"};
  const need = ["Status","Org","Job title"].concat(status === "Passed" && reason && "Notes" in F ? ["Notes"] : []);
  if (need.some(n => F[n] > 25)) throw {code:"tool_error", message:"This Sheet has too many columns for the inbox. Keep the job columns in A to Z."};
  COL = F;
  const sc = colLetter(F.Status);
  // 2. re-read the row and make sure it is still the same job
  const cur = parsePayload(await readRange(`${TAB_NAME}!A${r}:Z${r}`, true)).values || [];
  const row = cur[0] || [];
  const at = n => (n in F && row[F[n]] != null) ? String(row[F[n]]).trim() : "";
  if (at("Org") !== job.Org || at("Job title") !== job.Title || (job.Link && at("Link") !== job.Link)) throw {code:"changed"};
  const same = (a, b) => a.toLowerCase() === b.toLowerCase();
  if (same(at("Status"), status)){            // already set (maybe by an earlier try): nothing to write
    job.Status = status; return {noteFailed:false};
  }
  if (!same(at("Status"), job.Status)) throw {code:"changed"};
  // 3. write only the Status cell. A failure here might still have gone through, so check by reading it back.
  try { await writeCell(`${TAB_NAME}!${sc}${r}`, status); }
  catch(e){
    const back = parsePayload(await readRange(`${TAB_NAME}!${sc}${r}`, true).catch(() => null)).values;
    if (!(back && back[0] && String(back[0][0]).trim() === status)) throw e;
  }
  // 4. read the Status cell back
  const back = parsePayload(await readRange(`${TAB_NAME}!${sc}${r}`, true)).values;
  if (!(back && back[0] && String(back[0][0]).trim() === status)) throw {code:"verify"};
  job.Status = status;
  // 5. Pass with a reason: add it to Notes (keeps existing text)
  let noteFailed = false;
  if (status === "Passed" && reason){
    if (!("Notes" in F)) noteFailed = true;
    else {
      const old = at("Notes"), add = "Passed: " + reason;
      const nv = old ? old + "; " + add : add;
      try { await writeCell(`${TAB_NAME}!${colLetter(F.Notes)}${r}`, nv); job.Notes = nv; } catch(e){ noteFailed = true; }
    }
  }
  return {noteFailed};
}
async function changeStatus(row, status, okMsg, reason, el){
  const job = JOBS.find(x => x.row === row); if (!job || busy.has(row)) return;
  busy.add(row); notice = null; renderAll();
  try {
    const res = await writeStatus(job, status, reason);
    busy.delete(row);
    const card = document.querySelector(`[data-row="${row}"]`);
    if (card){ card.classList.add("leaving"); await sleep(300); }
    renderAll();
    toast(res.noteFailed ? okMsg + " The note did not save." : okMsg);
  } catch(e){
    busy.delete(row);
    if (e && e.code === "changed"){ toast("Your Sheet changed. Refreshing."); renderAll(); load(true); return; }
    if (e && e.code === "verify"){ toast("I could not confirm the change in your Sheet. Refreshing."); renderAll(); load(true); return; }
    notice = explain(e); renderAll();
  }
}

/* ---------- inline boxes ---------- */
function showPass(el, row){
  el.querySelector("[data-actions]").outerHTML = `<div class="passbox">
    <label for="why-${row}">Why pass? One line is enough.</label>
    <input id="why-${row}" type="text" autocomplete="off" placeholder="e.g. Too junior, wrong beat">
    <div class="row"><button class="btn" type="button" data-act="skip">Skip</button><button class="btn fill" type="button" data-act="passgo">Pass</button></div></div>`;
  const inp = el.querySelector("input"); inp.focus();
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter"){ e.preventDefault(); changeStatus(row, "Passed", "Passed.", inp.value.trim(), el); }
    else if (e.key === "Escape"){ e.preventDefault(); renderAll(); }
  });
}
function showApplied(el){
  el.querySelector("[data-actions]").outerHTML = `<div class="passbox"><label>Did you submit it?</label>
    <div class="row"><button class="btn" type="button" data-act="appliedno">Not yet</button><button class="btn fill" type="button" data-act="appliedyes">Yes, I applied</button></div></div>`;
  el.querySelector("[data-act=appliedyes]").focus();
}
function copyText(text, el){
  const fallback = () => {
    const act = el.querySelector("[data-actions]");
    if (act && !el.querySelector(".copybox")){
      const box = document.createElement("div"); box.className = "copybox";
      box.innerHTML = `<input readonly value="${esc(text)}" aria-label="Command to copy"><span>Press Ctrl+C (Cmd+C on a Mac)</span>`;
      act.after(box); const inp = box.querySelector("input"); inp.focus(); inp.select();
    }
    toast("Press Ctrl+C (Cmd+C on a Mac) to copy, then paste it into Claude.");
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast("Copied. Paste it into Claude."), fallback);
  } else fallback();
}

/* ---------- Sheet link setup ---------- */
async function saveSheetLink(raw){
  const id = extractId(raw);
  const box = $("#setupView");
  const showErr = text => { notice = {text}; $("#setupView").innerHTML = setupHtml(); $("#sheetLink").value = raw; };
  if (!id){ showErr("That does not look like a Google Sheets link. It should contain /d/ and a long code."); return; }
  $("#setupSave").disabled = true; $("#setupSave").textContent = "Checking...";
  const prev = sheetId; sheetId = id;
  try {
    const r = await readRange(TAB_NAME + "!A1:Z1", true);
    if (!headersOk(parsePayload(r).values)){ sheetId = prev; showErr("I opened that Sheet, but it does not look like your job tracker. I need a Jobs tab with Status, Org and Job title columns."); return; }
  } catch(e){ sheetId = prev; const x = explain(e); showErr(x.text); return; }
  sheetUrl = raw.trim(); notice = null; loaded = false; JOBS = [];
  await storeUrl(sheetUrl);
  mode = "ready"; tab = "inbox"; typeFilter = "ALL";
  load(true);
}

/* ---------- events ---------- */
document.addEventListener("submit", e => {
  if (e.target.id === "setupForm"){ e.preventDefault(); saveSheetLink($("#sheetLink").value); }
});
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab){
    tab = t.dataset.tab;
    document.querySelectorAll(".tabs .chip").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
    renderAll(); return;
  }
  if (t.dataset.type){ typeFilter = t.dataset.type; renderInbox(); return; }
  if (t.dataset.pick){
    const c = document.getElementById("job-" + t.dataset.pick);
    if (c){ c.scrollIntoView({behavior:"smooth", block:"center"}); c.classList.add("flash"); setTimeout(() => c.classList.remove("flash"), 1300); }
    return;
  }
  if (t.id === "refresh"){ if (mode === "ready") load(true); return; }
  if (t.id === "changesheet"){ notice = null; mode = "setup"; renderAll(); const i = $("#sheetLink"); if (i) i.focus(); return; }
  const act = t.dataset.act; if (!act) return;
  if (act === "retryload"){ load(true); return; }
  if (act === "setupcancel"){ notice = null; mode = "ready"; renderAll(); return; }
  const el = t.closest("[data-row]"); if (!el) return;
  const row = +el.dataset.row, j = JOBS.find(x => x.row === row); if (!j) return;
  if (act === "save") changeStatus(row, "Saved", "Saved. It's in Pipeline.", "", el);
  else if (act === "pass") showPass(el, row);
  else if (act === "skip") changeStatus(row, "Passed", "Passed.", "", el);
  else if (act === "passgo") changeStatus(row, "Passed", "Passed.", (el.querySelector("input").value || "").trim(), el);
  else if (act === "build") copyText("/apply " + j.Org + ", " + j.Title, el);
  else if (act === "applied") showApplied(el);
  else if (act === "appliedyes") changeStatus(row, "Applied", "Marked " + j.Org + " as Applied.", "", el);
  else if (act === "appliedno") renderAll();
  else if (act === "toInterview") changeStatus(row, "Interviewing", "Moved to Interviewing.", "", el);
  else if (act === "toOffer") changeStatus(row, "Offer", "Moved to Offer.", "", el);
});

/* ---------- start ---------- */
(async function start(){
  syncThemeBtn(); renderAll();
  try { mcp = window.claude ? await window.claude.use("mcp") : null; } catch(e){ mcp = null; }
  if (!mcp){ mode = "nomcp"; renderAll(); return; }
  let url = await getStoredUrl();
  if (!url && PREFILL_SHEET_URL){ url = PREFILL_SHEET_URL; await storeUrl(url); }
  const id = extractId(url);
  if (!id){ mode = "setup"; renderAll(); return; }
  sheetUrl = url; sheetId = id; mode = "ready"; renderAll();
  load(false);
})();
</script>
